<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, activeMenu, pageContent)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171d2f">
    <title th:text="${pageTitle} + ' · LabSpace'">LabSpace</title>
    <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:if="${activeMenu != 'maintenance'}" th:href="@{/css/student.css}">
    <link rel="stylesheet" th:if="${activeMenu == 'maintenance'}" th:href="@{/css/maintenance.css}">
    <script th:if="${activeMenu == 'maintenance'}" th:src="@{/js/maintenance.js}" defer></script>
    <script src="/js/app.js" th:src="@{/js/app.js}" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">Chuyển đến nội dung chính</a>
<div th:replace="~{fragments/icons :: icons}"></div>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments/header :: header(${pageTitle})}"></header>
        <main th:replace="${pageContent}"></main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<button class="sidebar-overlay" type="button" aria-label="Đóng menu điều hướng" hidden></button>
</body>
</html>

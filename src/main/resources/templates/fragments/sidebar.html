<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside id="app-sidebar" class="app-sidebar" th:fragment="sidebar(activeMenu)" aria-label="Điều hướng chính">
    <div class="sidebar-brand-row">
        <a class="brand" href="/student/equipment" th:href="@{/student/equipment}" aria-label="LabSpace">
            <span class="brand-mark"><svg class="icon"><use href="#icon-logo"/></svg></span>
            <span>labspace<span class="brand-dot">.</span></span>
        </a>
        <button class="icon-button sidebar-close" type="button" aria-label="Đóng menu điều hướng">
            <svg class="icon"><use href="#icon-close"/></svg>
        </button>
    </div>
    <p class="sidebar-caption">QUẢN LÝ PHÒNG LAB</p>
    <nav class="sidebar-nav" aria-label="Các chức năng">
        <a class="nav-link" href="/student/equipment" th:href="@{/student/equipment}"
           th:classappend="${activeMenu == 'overview' || activeMenu == 'equipment' ? 'is-active' : ''}"
           th:attr="aria-current=${activeMenu == 'equipment' ? 'page' : null}">
            <svg class="icon"><use href="#icon-equipment"/></svg><span>Tra cứu thiết bị</span><span class="nav-active-dot"></span>
        </a>
        <a class="nav-link" href="/student/loans" th:href="@{/student/loans}"
           th:classappend="${activeMenu == 'loans' ? 'is-active' : ''}"
           th:attr="aria-current=${activeMenu == 'loans' ? 'page' : null}">
            <svg class="icon"><use href="#icon-loans"/></svg><span>Phiếu mượn của tôi</span><span class="nav-active-dot"></span>
        </a>
        <a class="nav-link" href="/student/loans/create" th:href="@{/student/loans/create}"
           th:classappend="${activeMenu == 'loans-create' ? 'is-active' : ''}"
           th:attr="aria-current=${activeMenu == 'loans-create' ? 'page' : null}">
            <svg class="icon"><use href="#icon-arrow"/></svg><span>Đăng ký mượn mới</span><span class="nav-active-dot"></span>
        </a>
        <a class="nav-link" href="/student/notifications" th:href="@{/student/notifications}"
           th:classappend="${activeMenu == 'notifications' ? 'is-active' : ''}"
           th:attr="aria-current=${activeMenu == 'notifications' ? 'page' : null}">
            <svg class="icon"><use href="#icon-spark"/></svg><span>Thông báo cá nhân</span>
            <span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                  class="badge-dot" style="margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #e05252;"></span>
            <span class="nav-active-dot"></span>
        </a>
        <div class="nav-divider"></div>
        <a class="nav-link" href="/maintenance" th:href="@{/maintenance}"
           th:classappend="${activeMenu == 'maintenance' ? 'is-active' : ''}"
           th:attr="aria-current=${activeMenu == 'maintenance' ? 'page' : null}">
            <svg class="icon"><use href="#icon-maintenance"/></svg><span>Bảo trì thiết bị</span><span class="nav-active-dot"></span>
        </a>
        <a class="nav-link" href="/ui?section=processing" th:href="@{/ui(section='processing')}"
           th:classappend="${activeMenu == 'processing' ? 'is-active' : ''}"
           th:attr="aria-current=${activeMenu == 'processing' ? 'page' : null}">
            <svg class="icon"><use href="#icon-processing"/></svg><span>Xử lý mượn trả</span><span class="nav-active-dot"></span>
        </a>
    </nav>
    <div class="sidebar-bottom">
        <div class="sidebar-note">
            <svg class="icon"><use href="#icon-spark"/></svg>
            <p>Mọi thiết bị.<br><strong>Một nơi quản lý.</strong></p>
            <span>Để mỗi buổi thực hành luôn sẵn sàng.</span>
        </div>
        <div class="sidebar-signature"><span class="status-dot"></span> LAB EQUIPMENT SYSTEM</div>
    </div>
</aside>
</body>
</html>

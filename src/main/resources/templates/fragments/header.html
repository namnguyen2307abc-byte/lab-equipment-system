<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="app-header" th:fragment="header(pageTitle)">
    <div class="header-start">
        <button class="icon-button sidebar-toggle" type="button" aria-label="Mở menu điều hướng"
                aria-controls="app-sidebar" aria-expanded="false">
            <svg class="icon"><use href="#icon-menu"/></svg>
        </button>
        <nav class="breadcrumb" aria-label="Đường dẫn">
            <span>Không gian làm việc</span>
            <svg class="icon"><use href="#icon-chevron"/></svg>
            <strong th:text="${pageTitle}">Tổng quan</strong>
        </nav>
    </div>
    <div class="header-end">
        <a class="icon-button" sec:authorize="hasRole('STUDENT')"
           th:href="@{/student/notifications}" title="Thông báo" aria-label="Thông báo" style="position: relative;">
            <svg class="icon"><use href="#icon-spark"/></svg>
            <span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                  th:text="${unreadNotificationCount}"
                  style="position: absolute; top: -5px; right: -5px; background: #e05252; color: #fff; font-size: 10px; font-weight: 700; border-radius: 9px; padding: 1px 5px; line-height: 1.2;"></span>
        </a>
        <span class="preview-badge" th:if="${maintenanceUser == null and currentUser == null}">Bản xem mẫu</span>
        <span class="header-separator"></span>
        <div class="profile-preview" th:if="${maintenanceUser != null}">
            <span class="avatar" th:text="${maintenanceUser.staff ? 'NV' : 'SV'}"></span>
            <span class="profile-label">
                <strong th:text="${maintenanceUser.name}"></strong>
                <span th:text="${maintenanceUser.role.label}"></span>
            </span>
        </div>
        <div class="profile-preview" th:if="${maintenanceUser == null and currentUser != null}">
            <span class="avatar" th:text="${currentUser.role.name() == 'STUDENT' ? 'SV' : 'NV'}"></span>
            <span class="profile-label">
                <strong th:text="${currentUser.fullName}"></strong>
                <span th:text="${currentUser.role.name() == 'STUDENT' ? 'Sinh viên' : 'Cán bộ phòng Lab'}"></span>
            </span>
        </div>
        <div class="profile-preview" th:if="${maintenanceUser == null and currentUser == null}" aria-label="Chưa có thông tin người dùng">
            <span class="avatar">ND</span>
            <span class="profile-label"><strong>Người dùng</strong><span>Phòng thí nghiệm</span></span>
        </div>
        <form th:if="${maintenanceUser != null or currentUser != null}"
              th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
            <button type="submit" class="icon-button" title="Đăng xuất" aria-label="Đăng xuất" style="margin-left: 4px;">
                <svg class="icon"><use href="#icon-close"/></svg>
            </button>
        </form>
    </div>
</header>
</body>
</html>

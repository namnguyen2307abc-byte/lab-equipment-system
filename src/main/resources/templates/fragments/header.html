<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-header" th:fragment="header(pageTitle)">
    <div class="header-start">
        <button class="icon-button sidebar-toggle" type="button" aria-label="Mở menu điều hướng"
                aria-controls="app-sidebar" aria-expanded="false">
            <svg class="icon"><use href="#icon-menu"/></svg>
        </button>
        <nav class="breadcrumb" aria-label="Đường dẫn">
            <span>Không gian làm việc</span>
            <svg class="icon"><use href="#icon-chevron"/></svg>
            <strong th:text="${pageTitle}">Tổng quan</strong>
        </nav>
    </div>
    <div class="header-end">
        <span class="preview-badge" th:if="${maintenanceUser == null}">Bản xem mẫu</span>
        <span class="header-separator"></span>
        <div class="profile-preview" th:if="${maintenanceUser != null}">
            <span class="avatar" th:text="${maintenanceUser.staff ? 'NV' : 'SV'}"></span>
            <span class="profile-label"><strong th:text="${maintenanceUser.name}"></strong><span th:text="${maintenanceUser.role.label}"></span></span>
        </div>
        <div class="profile-preview" th:if="${maintenanceUser == null}" aria-label="Vai trò minh họa: nhân viên phòng lab">
            <span class="avatar">NV</span>
            <span class="profile-label"><strong>Nhân viên</strong><span>Phòng thí nghiệm</span></span>
        </div>
    </div>
</header>
</body>
</html>

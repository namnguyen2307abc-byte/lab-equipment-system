<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(${pageTitle}, ${activeMenu}, ~{::main})}">
<head><title>Tài khoản</title></head><body>
<main id="main-content" class="page-content" tabindex="-1">
    <div class="page-heading">
        <div>
            <p class="eyebrow">QUẢN TRỊ HỆ THỐNG</p>
            <h1 th:text="${editing == null ? 'Tạo tài khoản' : 'Sửa tài khoản'}">Tài khoản</h1>
            <p class="page-description" th:if="${editing != null}" th:text="${'Tên đăng nhập: ' + editing.username}"></p>
        </div>
        <a class="button button-secondary" th:href="@{/admin/accounts}">Quay lại danh sách</a>
    </div>

    <div th:if="${successMessage}" class="student-alert alert-success" style="margin-bottom:16px"><span th:text="${successMessage}"></span></div>
    <div th:if="${errorMessage}" class="student-alert alert-error" style="margin-bottom:16px"><span th:text="${errorMessage}"></span></div>

    <section class="panel" style="max-width:640px">
        <form th:object="${form}" method="post"
              th:action="${editing == null} ? @{/admin/accounts} : @{/admin/accounts/{id}(id=${editing.id})}">
            <div class="form-field" th:if="${editing == null}">
                <label for="username">Tên đăng nhập <span class="req">*</span></label>
                <input id="username" th:field="*{username}" maxlength="100" required>
                <small class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
            </div>
            <div class="form-field">
                <label for="fullName">Họ tên <span class="req">*</span></label>
                <input id="fullName" th:field="*{fullName}" maxlength="100" required>
                <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
            </div>
            <div class="form-field">
                <label for="email">Email <span class="req">*</span></label>
                <input id="email" type="email" th:field="*{email}" maxlength="255" required>
                <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </div>
            <div class="form-field">
                <label for="phone">Số điện thoại</label>
                <input id="phone" th:field="*{phone}" maxlength="20">
                <small class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
            </div>
            <div class="form-field">
                <label for="role">Vai trò <span class="req">*</span></label>
                <select id="role" th:field="*{role}">
                    <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.label}"></option>
                </select>
                <small class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></small>
            </div>
            <div class="form-field" th:if="${editing == null}">
                <label for="password">Mật khẩu ban đầu <span class="req">*</span></label>
                <input id="password" type="password" th:field="*{password}" minlength="6" maxlength="72" required autocomplete="new-password">
                <small>Ít nhất 6 ký tự, tối đa 72 byte UTF-8. Ký tự tiếng Việt có thể chiếm nhiều byte.</small>
                <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
            </div>
            <button class="button button-primary" type="submit" th:text="${editing == null ? 'Tạo tài khoản' : 'Lưu thay đổi'}">Lưu</button>
        </form>
    </section>

    <section class="panel" style="max-width:640px;margin-top:20px" th:if="${editing != null}">
        <div class="panel-heading"><div><h2>Đặt lại mật khẩu</h2><p>Nhập mật khẩu mới cho người dùng này.</p></div></div>
        <form method="post" th:action="@{/admin/accounts/{id}/reset-password(id=${editing.id})}">
            <div class="form-field">
                <label for="newPassword">Mật khẩu mới</label>
                <input id="newPassword" name="newPassword" type="password" minlength="6" maxlength="72" required autocomplete="new-password">
                <small>Ít nhất 6 ký tự, tối đa 72 byte UTF-8. Ký tự tiếng Việt có thể chiếm nhiều byte.</small>
            </div>
            <button class="button button-secondary" type="submit">Đặt lại mật khẩu</button>
        </form>
    </section>
</main></body></html>

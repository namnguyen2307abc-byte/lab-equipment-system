<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${pageTitle}, 'equipment', ~{::main})}">
<head>
    <title th:text="${pageTitle} + ' · LabSpace'">Thiết bị · LabSpace</title>
</head>
<body>
<main id="main-content" class="page-content">
    <link rel="stylesheet" th:href="@{/css/equipment.css}">

    <div class="equipment-container">
        <!-- Error alert -->
        <div th:if="${errorMessage}" class="alert alert-error" role="alert">
            <svg class="icon"><use href="#icon-close"/></svg>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Heading -->
        <div class="page-heading">
            <div>
                <p class="eyebrow" th:text="${isEdit ? 'CHỈNH SỬA THIẾT BỊ' : 'THÊM MỚI THIẾT BỊ'}">QUẢN LÝ THIẾT BỊ</p>
                <h1 th:text="${pageTitle}">Thêm thiết bị mới</h1>
                <p class="page-description">Nhập đầy đủ thông tin mã định danh, loại thiết bị và tình trạng vật lý.</p>
            </div>
            <div>
                <a th:href="@{/equipment}" class="button button-secondary">
                    <span>&larr; Quay lại danh sách</span>
                </a>
            </div>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <form th:action="${isEdit ? '/equipment/' + deviceId + '/edit' : '/equipment'}"
                  th:object="${deviceRequest}" method="post">

                <div class="form-grid">
                    <!-- Mã thiết bị -->
                    <div class="form-group">
                        <label for="code" class="form-label form-label-required">Mã thiết bị</label>
                        <input type="text" id="code" th:field="*{code}" class="form-control"
                               placeholder="Ví dụ: ARD-001, ESP-002, RPI-001"
                               th:classappend="${#fields.hasErrors('code') ? 'is-invalid' : ''}">
                        <span th:if="${#fields.hasErrors('code')}" th:errors="*{code}" class="field-error"></span>
                        <span class="form-help">Mã định danh duy nhất cho từng thiết bị vật lý trong phòng lab.</span>
                    </div>

                    <!-- Tên thiết bị -->
                    <div class="form-group">
                        <label for="name" class="form-label form-label-required">Tên thiết bị</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               placeholder="Ví dụ: Arduino Uno R3, Module ESP32 WROOM"
                               th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}">
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
                    </div>

                    <!-- Loại thiết bị (Category) -->
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <label for="categoryId" class="form-label form-label-required">Loại thiết bị</label>
                            <a th:href="@{/equipment/categories/new(redirect='equipment_new')}"
                               style="font-size: 11px; font-weight: 600; color: #4a683e; text-decoration: underline;">
                               + Thêm loại thiết bị mới
                            </a>
                        </div>
                        <select id="categoryId" th:field="*{categoryId}" class="form-select-full"
                                th:classappend="${#fields.hasErrors('categoryId') ? 'is-invalid' : ''}">
                            <option value="">-- Chọn loại thiết bị --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="field-error"></span>
                    </div>

                    <!-- Tình trạng thiết bị (Status) -->
                    <div class="form-group">
                        <label for="status" class="form-label form-label-required">Tình trạng thiết bị</label>
                        <select id="status" th:field="*{status}" class="form-select-full"
                                th:classappend="${#fields.hasErrors('status') ? 'is-invalid' : ''}">
                            <option th:each="st : ${statuses}"
                                    th:value="${st.name()}"
                                    th:text="${st.displayName}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="field-error"></span>
                        <span class="form-help">Trạng thái khả dụng hiện tại trong kho của phòng lab.</span>
                    </div>

                    <!-- Thông số kỹ thuật -->
                    <div class="form-group form-grid-full">
                        <label for="specifications" class="form-label">Thông số kỹ thuật</label>
                        <textarea id="specifications" th:field="*{specifications}" class="form-textarea" rows="3"
                                  placeholder="Ví dụ: Vi điều khiển ATmega328P, Điện áp hoạt động 5V, 14 chân Digital I/O, 6 chân Analog"></textarea>
                        <span th:if="${#fields.hasErrors('specifications')}" th:errors="*{specifications}" class="field-error"></span>
                    </div>

                    <!-- Mô tả / Ghi chú -->
                    <div class="form-group form-grid-full">
                        <label for="description" class="form-label">Mô tả &amp; Ghi chú</label>
                        <textarea id="description" th:field="*{description}" class="form-textarea" rows="3"
                                  placeholder="Mô tả phụ kiện đi kèm (cáp USB, hộp đựng), vị trí lưu trữ trong tủ thiết bị..."></textarea>
                        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/equipment}" class="button button-secondary">Hủy bỏ</a>
                    <button type="submit" class="button button-primary">
                        <svg class="icon"><use href="#icon-check"/></svg>
                        <span th:text="${isEdit ? 'Lưu thay đổi' : 'Thêm thiết bị'}">Lưu</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>

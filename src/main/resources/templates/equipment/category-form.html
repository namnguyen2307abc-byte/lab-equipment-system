<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${pageTitle}, 'equipment', ~{::main})}">
<head>
    <title th:text="${pageTitle} + ' · LabSpace'">Thêm loại thiết bị · LabSpace</title>
</head>
<body>
<main id="main-content" class="page-content">
    <link rel="stylesheet" th:href="@{/css/equipment.css}">

    <div class="equipment-container">
        <!-- Error alert -->
        <div th:if="${errorMessage}" class="alert alert-error" role="alert">
            <svg class="icon"><use href="#icon-close"/></svg>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Heading -->
        <div class="page-heading">
            <div>
                <p class="eyebrow">DANH MỤC THIẾT BỊ · THÀNH VIÊN 2</p>
                <h1 th:text="${pageTitle}">Thêm loại thiết bị mới</h1>
                <p class="page-description">Tạo nhóm phân loại mới cho thiết bị phòng thí nghiệm (Ví dụ: Arduino, ESP32, Raspberry Pi, Dao động ký...).</p>
            </div>
            <div>
                <a th:href="@{/equipment/categories}" class="button button-secondary">
                    <span>&larr; Quản lý loại thiết bị</span>
                </a>
            </div>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <form th:action="@{/equipment/categories/new}" th:object="${categoryRequest}" method="post">
                <input type="hidden" name="redirectTarget" th:value="${redirectTarget}">

                <div class="form-grid">
                    <!-- Tên loại thiết bị -->
                    <div class="form-group form-grid-full">
                        <label for="cat-name" class="form-label form-label-required">Tên loại thiết bị</label>
                        <input type="text" id="cat-name" th:field="*{name}" class="form-control"
                               placeholder="Ví dụ: Arduino, ESP32, Module cảm biến, Máy đo..."
                               th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}" autofocus>
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
                        <span class="form-help">Tên loại thiết bị không được để trống và không được trùng với loại đã có trong hệ thống.</span>
                    </div>

                    <!-- Mô tả -->
                    <div class="form-group form-grid-full">
                        <label for="cat-desc" class="form-label">Mô tả loại thiết bị</label>
                        <textarea id="cat-desc" th:field="*{description}" class="form-textarea" rows="4"
                                  placeholder="Mô tả công dụng hoặc phạm vi ứng dụng trong các bài thí nghiệm..."></textarea>
                        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="${redirectTarget == 'equipment_new' ? '/equipment/new' : '/equipment/categories'}" class="button button-secondary">
                        <span>Hủy bỏ</span>
                    </a>
                    <button type="submit" class="button button-primary">
                        <svg class="icon"><use href="#icon-check"/></svg>
                        <span>Lưu loại thiết bị</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>

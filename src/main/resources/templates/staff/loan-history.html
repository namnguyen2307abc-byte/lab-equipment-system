<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(${pageTitle}, 'loan-processing', ~{::main})}">
<head><title>Lịch sử mượn trả · LabSpace</title></head><body>
<main id="main-content" class="page-content processing-content" tabindex="-1">
<div class="page-heading"><div><p class="eyebrow">MƯỢN TRẢ THIẾT BỊ</p><h1>Lịch sử mượn trả</h1></div></div>
<nav th:replace="~{staff/fragments :: navigation('history')}"></nav>
<div th:replace="~{staff/fragments :: messages}"></div>

<section class="panel"><div class="panel-heading processing-heading"><div><h2>Phiếu đã đóng</h2><p>Các phiếu đã trả, bị từ chối hoặc đã hủy.</p></div>
<form method="get" th:action="@{/staff/loans/history}" class="processing-filter"><label for="keyword">Tìm kiếm</label>
<input id="keyword" name="keyword" th:value="${keyword}" maxlength="100" placeholder="Mã thiết bị hoặc tên sinh viên"><button class="button button-secondary" type="submit">Tìm</button><a th:href="@{/staff/loans/history}">Bỏ lọc</a></form></div>
<div class="processing-table-wrap" tabindex="0" aria-label="Lịch sử mượn trả"><table class="processing-table"><thead><tr><th>Mã phiếu</th><th>Sinh viên</th><th>Thiết bị</th><th>Đã nhận trả</th><th>Trạng thái</th><th>Người xử lý gần nhất</th><th>Chi tiết</th></tr></thead>
<tbody><tr th:each="item : ${historyList}"><td th:text="${item.requestCode}"></td><td th:text="${item.studentName}"></td>
<td><strong th:text="${item.equipmentCode}"></strong><small th:text="${item.equipmentName}"></small></td>
<td th:text="${item.returnedAt != null ? #temporals.format(item.returnedAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
<td><span class="processing-status" th:text="${item.statusLabel}"></span></td><td th:text="${item.processedByName}"></td>
<td><a th:href="@{/staff/loans/detail/{id}(id=${item.id})}">Xem phiếu</a></td></tr>
<tr th:if="${#lists.isEmpty(historyList)}"><td colspan="7" class="processing-empty">Không có lịch sử phù hợp.</td></tr></tbody></table></div></section>

</main></body></html>

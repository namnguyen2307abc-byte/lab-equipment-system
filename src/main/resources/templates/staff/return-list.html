<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(${pageTitle}, 'loan-processing', ~{::main})}">
<head><title>Nhận trả thiết bị · LabSpace</title></head><body>
<main id="main-content" class="page-content processing-content" tabindex="-1">
<div class="page-heading"><div><p class="eyebrow">MƯỢN TRẢ THIẾT BỊ</p><h1>Nhận trả thiết bị</h1></div></div>
<nav th:replace="~{staff/fragments :: navigation('return')}"></nav>
<div th:replace="~{staff/fragments :: messages}"></div>

<section class="panel"><div class="panel-heading"><div><h2>Thiết bị đang được mượn</h2><p>Chỉ xác nhận nhận trả sau khi đã nhận và kiểm tra thiết bị thực tế.</p></div></div>
<div class="processing-table-wrap" tabindex="0" aria-label="Danh sách thiết bị cần nhận trả">
<table class="processing-table"><thead><tr><th>Mã phiếu</th><th>Sinh viên</th><th>Thiết bị</th><th>Đã bàn giao</th><th>Hạn trả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
<tbody><tr th:each="req : ${returnRequests}"><td th:text="${req.requestCode}"></td><td th:text="${req.studentName}"></td>
<td><strong th:text="${req.equipmentCode}"></strong><small th:text="${req.equipmentName}"></small></td>
<td th:text="${req.handedOverAt != null ? #temporals.format(req.handedOverAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
<td th:text="${#temporals.format(req.dueAt, 'dd/MM/yyyy HH:mm')}"></td><td><span class="processing-status" th:text="${req.statusLabel}"></span></td>
<td><a class="button button-secondary" th:href="@{/staff/loans/detail/{id}(id=${req.id})}">Kiểm tra và nhận trả</a></td></tr>
<tr th:if="${#lists.isEmpty(returnRequests)}"><td colspan="7" class="processing-empty">Không có thiết bị đang chờ nhận trả.</td></tr></tbody></table></div></section>

</main></body></html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý & Phê duyệt phiếu trả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="mb-4">
        <a th:href="@{/staff/loans/borrow-requests}" class="btn btn-outline-primary">1. Quản lý phiếu mượn</a>
        <a th:href="@{/staff/loans/return-requests}" class="btn btn-primary">2. Quản lý phiếu trả</a>
        <a th:href="@{/staff/loans/history}" class="btn btn-outline-secondary">3. Lịch sử mượn trả</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h4 class="mb-0">Danh sách phiếu yêu cầu trả thiết bị</h4>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Mã phiếu</th>
                    <th>Sinh viên</th>
                    <th>Mã TB</th>
                    <th>Tên thiết bị</th>
                    <th>Ngày bàn giao</th>
                    <th>Hạn trả</th>
                    <th>Trạng thái</th>
                    <th>Kiểm tra & Phê duyệt trả</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="req : ${returnRequests}">
                    <td th:text="${req.requestCode}"></td>
                    <td th:text="${req.studentName}"></td>
                    <td><strong th:text="${req.equipmentCode}"></strong></td>
                    <td th:text="${req.equipmentName}"></td>
                    <td th:text="${req.handedOverAt != null ? #temporals.format(req.handedOverAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                    <td th:text="${#temporals.format(req.dueAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><span class="badge bg-warning text-dark" th:text="${req.statusLabel}"></span></td>
                    <td>
                        <form th:action="@{/staff/loans/confirm-return/{id}(id=${req.id})}" method="post" class="d-flex gap-2">
                            <input type="text" name="staffNotes" class="form-control form-control-sm" placeholder="Ghi chú tình trạng TB...">
                            <button type="submit" class="btn btn-sm btn-success text-nowrap">Xác nhận trả</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(returnRequests)}">
                    <td colspan="8" class="text-center text-muted">Không có phiếu chờ trả nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

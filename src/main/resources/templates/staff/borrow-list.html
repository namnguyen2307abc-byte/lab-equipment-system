<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý phiếu mượn thiết bị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="mb-4">
        <a th:href="@{/staff/loans/borrow-requests}" class="btn btn-primary">1. Quản lý phiếu mượn</a>
        <a th:href="@{/staff/loans/return-requests}" class="btn btn-outline-primary">2. Quản lý phiếu trả</a>
        <a th:href="@{/staff/loans/history}" class="btn btn-outline-secondary">3. Lịch sử mượn trả</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Danh sách phiếu yêu cầu mượn thiết bị</h4>
            <form th:action="@{/staff/loans/borrow-requests}" method="get" class="d-flex gap-2">
                <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                    <option value="">-- Tất cả (Chờ duyệt & Chờ giao) --</option>
                    <option value="PENDING">Chờ duyệt (PENDING)</option>
                    <option value="APPROVED">Đã duyệt - Chờ bàn giao (APPROVED)</option>
                </select>
            </form>
        </div>

        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Mã phiếu</th>
                    <th>Sinh viên</th>
                    <th>Mã TB</th>
                    <th>Tên thiết bị</th>
                    <th>Ngày yêu cầu</th>
                    <th>Hạn trả</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="req : ${requests}">
                    <td th:text="${req.requestCode}"></td>
                    <td th:text="${req.studentName}"></td>
                    <td><strong th:text="${req.equipmentCode}"></strong></td>
                    <td th:text="${req.equipmentName}"></td>
                    <td th:text="${#temporals.format(req.requestedAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(req.dueAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${req.statusLabel}"></span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{/staff/loans/detail/{id}(id=${req.id})}" class="btn btn-sm btn-secondary">Chi tiết & Duyệt</a>
                            <form th:if="${req.status.name() == 'APPROVED'}" th:action="@{/staff/loans/handover/{id}(id=${req.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-primary">Bàn giao TB</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="8" class="text-center text-muted">Không có phiếu yêu cầu mượn nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

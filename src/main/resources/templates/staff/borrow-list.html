<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(${pageTitle}, 'loan-processing', ~{::main})}">
<head><title>Xử lý phiếu mượn · LabSpace</title></head><body>
<main id="main-content" class="page-content processing-content" tabindex="-1">
<div class="page-heading"><div><p class="eyebrow">MƯỢN TRẢ THIẾT BỊ</p><h1>Xử lý phiếu mượn</h1></div></div>
<nav th:replace="~{staff/fragments :: navigation('borrow')}"></nav>
<div th:replace="~{staff/fragments :: messages}"></div>

<section class="panel">
<div class="panel-heading processing-heading"><div><h2>Phiếu chờ duyệt và bàn giao</h2><p>Kiểm tra thông tin sinh viên và tình trạng thiết bị trước khi xử lý.</p></div>
<form method="get" th:action="@{/staff/loans/borrow-requests}" class="processing-filter"><label for="status">Trạng thái</label><select id="status" name="status">
<option value="">Tất cả</option><option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Chờ duyệt</option><option value="APPROVED" th:selected="${selectedStatus == 'APPROVED'}">Đã duyệt</option>
</select><button class="button button-secondary" type="submit">Lọc</button></form></div>
<div class="processing-table-wrap" tabindex="0" aria-label="Danh sách phiếu mượn">
<table class="processing-table"><thead><tr><th>Mã phiếu</th><th>Sinh viên</th><th>Thiết bị</th><th>Bắt đầu mượn</th><th>Hạn trả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
<tbody><tr th:each="req : ${requests}">
<td th:text="${req.requestCode}"></td><td th:text="${req.studentName}"></td><td><strong th:text="${req.equipmentCode}"></strong><small th:text="${req.equipmentName}"></small></td>
<td th:text="${req.borrowDate != null ? #temporals.format(req.borrowDate, 'dd/MM/yyyy HH:mm') : '—'}"></td>
<td th:text="${#temporals.format(req.dueAt, 'dd/MM/yyyy HH:mm')}"></td><td><span class="processing-status" th:text="${req.statusLabel}"></span></td>
<td><a class="button button-secondary" th:href="@{/staff/loans/detail/{id}(id=${req.id})}">Chi tiết</a></td>
</tr><tr th:if="${#lists.isEmpty(requests)}"><td colspan="7" class="processing-empty">Không có phiếu mượn phù hợp.</td></tr></tbody></table></div></section>

</main></body></html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết & Phê duyệt phiếu mượn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <a th:href="@{/staff/loans/borrow-requests}" class="btn btn-outline-secondary mb-3">← Quay lại danh sách</a>

    <div class="card shadow-sm" th:if="${loan != null}">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Chi tiết phiếu mượn: <span th:text="${loan.requestCode}"></span></h4>
            <span class="badge bg-warning text-dark fs-6" th:text="${loan.statusLabel}"></span>
        </div>

        <div class="card-body">
            <div class="row">
                <div class="col-md-6 border-end">
                    <h5 class="text-primary mb-3">1. Thông tin sinh viên & Thời gian</h5>
                    <p><strong>Sinh viên:</strong> <span th:text="${loan.studentName}"></span> (<span th:text="${loan.studentEmail}"></span>)</p>
                    <p><strong>Mục đích mượn:</strong> <span th:text="${loan.purpose}"></span></p>
                    <p><strong>Ghi chú của SV:</strong> <span th:text="${loan.notes}"></span></p>
                    <hr>
                    <p><strong>Ngày yêu cầu:</strong> <span th:text="${#temporals.format(loan.requestedAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p><strong>Hạn trả dự kiến:</strong> <span th:text="${#temporals.format(loan.dueAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                </div>

                <div class="col-md-6">
                    <h5 class="text-primary mb-3">2. Thông tin thiết bị & Phê duyệt</h5>
                    <p><strong>Mã thiết bị:</strong> <span class="badge bg-secondary" th:text="${loan.equipmentCode}"></span></p>
                    <p><strong>Tên thiết bị:</strong> <span th:text="${loan.equipmentName}"></span></p>
                    <p><strong>Trạng thái thiết bị:</strong> <span class="fw-bold text-success" th:text="${loan.equipmentStatus}"></span></p>

                    <!-- Form Duyệt / Từ chối khi đang PENDING -->
                    <div th:if="${loan.status.name() == 'PENDING'}" class="mt-3 p-3 bg-light border rounded">
                        <form th:action="@{/staff/loans/approve/{id}(id=${loan.id})}" method="post" class="mb-3">
                            <label class="form-label fw-bold">Ghi chú nhân viên (khi duyệt):</label>
                            <input type="text" name="staffNotes" class="form-control form-control-sm mb-2" placeholder="Nhập ghi chú bàn giao...">
                            <button type="submit" class="btn btn-success btn-sm">Phê duyệt phiếu mượn (Approve)</button>
                        </form>

                        <form th:action="@{/staff/loans/reject/{id}(id=${loan.id})}" method="post">
                            <label class="form-label fw-bold text-danger">Lý do từ chối:</label>
                            <input type="text" name="rejectReason" class="form-control form-control-sm mb-2" placeholder="Nhập lý do từ chối..." required>
                            <button type="submit" class="btn btn-danger btn-sm">Từ chối phiếu mượn (Reject)</button>
                        </form>
                    </div>

                    <!-- Nút Bàn giao khi đã APPROVED -->
                    <div th:if="${loan.status.name() == 'APPROVED'}" class="mt-3">
                        <form th:action="@{/staff/loans/handover/{id}(id=${loan.id})}" method="post">
                            <button type="submit" class="btn btn-primary">Xác nhận bàn giao thiết bị (Handover)</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Lab Equipment System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>
    <div class="login-card bg-white p-4 p-sm-5">
        <div class="text-center mb-4">
            <i class="fas fa-microchip fa-3x text-primary mb-2"></i>
            <h4 class="fw-bold text-dark">Hệ Thống Mượn Trả Thiết Bị</h4>
            <p class="text-muted small">Đăng nhập tài khoản để tiếp tục</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger small py-2 mb-3" th:text="${errorMessage}">
            Lỗi đăng nhập!
        </div>
        <div th:if="${successMessage}" class="alert alert-success small py-2 mb-3" th:text="${successMessage}">
            Thành công!
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Tên đăng nhập (ví dụ: student)" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Mật khẩu (ví dụ: 123456)" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="fas fa-sign-in-alt me-1"></i> Đăng Nhập
            </button>
        </form>

        <div class="mt-4 pt-3 border-top">
            <p class="small text-muted mb-2 fw-semibold">Tài khoản demo mẫu có sẵn (Mật khẩu: <code>123456</code>):</p>
            <div class="d-flex flex-column gap-1 small">
                <a th:href="@{/switch-user/student}" class="text-decoration-none text-primary">
                    <i class="fas fa-user-graduate me-1"></i> <strong>student</strong> - Sinh viên: Nguyễn Văn Ngọc (Đăng nhập nhanh)
                </a>
                <a th:href="@{/switch-user/student2}" class="text-decoration-none text-secondary">
                    <i class="fas fa-user-graduate me-1"></i> <strong>student2</strong> - Sinh viên: Trần Thị Mai
                </a>
            </div>
        </div>
    </div>
</body>
</html>
